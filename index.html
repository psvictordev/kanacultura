<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:          #1A2218;
    --bege:        #E8DCC8;
    --bege-light:  #F2EBD9;
    --bege-dark:   #C9BA9E;
    --terracota:   #B05C3A;

  }
  a:focus-visible { outline: 2px solid var(--terracota-l); outline-offset: 3px; }

  main {
    min-height: 100vh; min-height: 100svh;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 3.5rem; padding: 4rem 1.5rem 3rem; text-align: center;
  }

  .brand { animation: fadeUp 0.8s ease both; }
  .logo {
    font-family: var(--serif); font-weight: 900; line-height: 1;
    font-size: clamp(3.5rem, 14vw, 8rem); letter-spacing: -0.02em;
    color: var(--bege-light);
  }
  .logo em { font-style: italic; color: var(--verde-kana); }
  .tagline {
    margin-top: 1.25rem; font-size: 0.85rem; letter-spacing: 0.28em;
    text-transform: uppercase; color: var(--terracota-l);
  }

  .contact {
    width: 100%; max-width: 640px;
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 2rem;
    border-top: 1px solid var(--verde-line); padding-top: 2.5rem;
    animation: fadeUp 0.8s 0.2s ease both;
  }
  .label { font-size: 0.78rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--terracota-l); margin-bottom: 0.4rem; }
  .value { font-size: 1rem; color: var(--bege); line-height: 1.55; }
  .value a { color: inherit; text-decoration: none; border-bottom: 1px solid rgba(201,122,84,0.6); transition: color 0.3s; }
  .value a:hover { color: var(--terracota-l); }

  .actions { display: flex; gap: 0.9rem; flex-wrap: wrap; justify-content: center; animation: fadeUp 0.8s 0.35s ease both; }
  .btn {
    padding: 0.85rem 1.8rem; font-family: var(--sans); font-size: 0.92rem; font-weight: 500;
    letter-spacing: 0.03em; text-decoration: none; border: 1px solid transparent;
    transition: background 0.3s, border-color 0.3s, color 0.3s;
  }
  .btn-primary { background: var(--terracota); color: var(--bege-light); }
  .btn-primary:hover { background: var(--terracota-l); }
  .btn-outline { color: var(--bege); border-color: rgba(232,220,200,0.35); }
  .btn-outline:hover { border-color: var(--terracota-l); color: var(--terracota-l); }

  footer { padding: 0 1.5rem 2rem; text-align: center; font-size: 0.8rem; color: rgba(232,220,200,0.5); }

  @keyframes fadeUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) {
    .brand, .contact, .actions { animation: none; }
    * { transition: none !important; }
  }
  @media (max-width: 600px) {
    .contact { grid-template-columns: 1fr; gap: 1.5rem; }
    main { gap: 2.5rem; }
  }
</style>
